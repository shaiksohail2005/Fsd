<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper links Example </title>
</head>
<body>
    <h2>Hyperlinks Example using &lt;a&gt; Tag</h2>
    <p>
        Visit <a href="https://www.wikipedia.org/" target="_blank">Wikipedia</a> for more information.
    </p>
    <p>
        Go to <a href="https://www.github.com/">GitHub</a> to explore open source projects.
    </p>
    <p>
        <a href="https://www.youtube.com/">Click here</a> to visit youtube.
    </p>
    
</body>
</html>
