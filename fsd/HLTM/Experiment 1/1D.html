<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Thumbnail Gallery</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .gallery {
      display: grid;
      size: 500px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 3fr));
      gap: 100px;
      margin-top: 20px;
    }
    .gallery a img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 2px solid #ccc;
      border-radius: 6px;
      display: block;
      margin: auto;
    }
    .gallery a:hover img {
      border-color: #333;
    }
  </style>
</head>

<body>
    <h1>Thumbnail Image Gallery</h1>
  <p style="text-align:center">Click on a thumbnail to view the full-sized image.</p>

  <div class="gallery">
    <a href="syam.jpg" target="_blank">
      <img src="syam.jpg" alt="syam">
    </a>
    <a href="bob1.jpg" target="_blank">
      <img src="bob1.jpg" alt="bob1">
    </a>
    <a href="bob2.jpg" target="_blank">
      <img src="bob2.jpg" alt="bob2">
    </a>
    
    </a>
  </div>
</body>
</html>
