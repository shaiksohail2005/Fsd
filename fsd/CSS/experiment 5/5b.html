<!DOCTYPE html>
<html>
<head>
  <title>Tilted Fixed Background</title>
 <style>
  body {
    min-height: 200vh;
    margin: 0;
    font-family: Arial, sans-serif;
    position: relative;
    z-index: 1;
  }

  body::before {
    content: "";
    position: fixed;
    top: 50%; /* halfway down the viewport */
    left: 50%;
    width: 100vw;  /* full width */
    height: 100vh; /* full height */
    background: url("image.jpg") center/cover no-repeat;
    transform: translate(-50%, -50%) scaleX(-1) rotate(-12deg);
    transform-origin: center;
    z-index: 0;
    pointer-events: none; /* ensure clicks go through */
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 2rem;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>Fixed Tilted Background</h1>
    <p>Scroll down to see that the image stays in place halfway down the page.</p>
  </div>
</body>
</html>
